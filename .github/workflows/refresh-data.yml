name: Refresh ETF data

# Daily scheduled refresh + manual trigger. Needs the repo secret AV_API_KEY.
on:
  schedule:
    - cron: '17 11 * * *' # 11:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch holdings (stalest funds first, keeps old file on failure)
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
        run: node scripts/fetch-etfs.mjs
      - name: Commit changes
        id: commit
        run: |
          git config user.name "etf-xray-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh ETF holdings $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
